<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raíces cuadradas: ¿entre qué números está?</title>
<style>
  :root{
    --fondo:#f6f4ee; --tarjeta:#ffffff; --texto:#23303b; --suave:#5d6b78; --borde:#e2ddd0;
    --azul:#1f6fb2; --azul-claro:#e3eefb; --sobra:#d98a1f;
    --ok:#e4f6ea; --ok-borde:#2e9e5b; --mal:#fdecea; --mal-borde:#c0392b;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --fondo:#0f1720; --tarjeta:#17232f; --texto:#e9eff5; --suave:#9db0c2; --borde:#2c3d4e;
      --azul:#6db0ec; --azul-claro:#1d3550; --sobra:#f0a64a;
      --ok:#143626; --ok-borde:#4cc585; --mal:#3a1b19; --mal-borde:#ef8a80;
    }
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--fondo);color:var(--texto);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:18px;line-height:1.5;}
  .contenedor{max-width:1040px;margin:0 auto;padding:0 16px 24px;}
  header{padding:32px 0 16px;}
  h1{margin:0 0 6px;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.2;}
  header p{margin:0;color:var(--suave);max-width:62ch;}

  .pestanas{display:flex;gap:6px;border-bottom:2px solid var(--borde);margin-bottom:16px;}
  .pestanas button{font:inherit;font-weight:600;font-size:1.1rem;padding:12px 24px;margin-bottom:-2px;border:0;border-bottom:4px solid transparent;border-radius:10px 10px 0 0;background:none;color:var(--suave);cursor:pointer;}
  .pestanas button:hover{color:var(--azul);}
  .pestanas button[aria-selected="true"]{background:var(--tarjeta);color:var(--azul);border-bottom-color:var(--azul);}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--azul);outline-offset:2px;}

  .rejilla{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start;}
  @media (min-width:860px){
    .rejilla{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);}
    .rejilla.una{grid-template-columns:minmax(0,640px);}
  }
  .panel{display:flex;flex-direction:column;gap:16px;min-width:0;}
  .tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:16px 18px;min-width:0;}
  .tarjeta p{margin:8px 0 0;}
  .tarjeta p:first-child{margin-top:0;}
  .suave{color:var(--suave);}
  [hidden]{display:none !important;}

  svg{display:block;width:100%;height:auto;}
  .c-ok{fill:var(--azul);}
  .c-so{fill:var(--sobra);}
  .c-fa{fill:none;stroke:var(--suave);stroke-width:1.5;stroke-dasharray:4 3;}
  .marco{fill:none;stroke:var(--suave);stroke-width:1.5;stroke-dasharray:7 5;}
  .llave{fill:none;stroke:var(--azul);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
  .llaveK{fill:none;stroke:var(--suave);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .tx{font:700 24px "Segoe UI",system-ui,sans-serif;fill:var(--azul);text-anchor:middle;}
  .txK{font:600 22px "Segoe UI",system-ui,sans-serif;fill:var(--suave);text-anchor:middle;}
  .eje{stroke:var(--suave);stroke-width:2;}
  .marca{stroke:var(--suave);stroke-width:2;}
  .num{font:600 15px "Segoe UI",system-ui,sans-serif;fill:var(--suave);text-anchor:middle;}
  .num.fuerte{fill:var(--azul);font-weight:700;font-size:18px;}
  .banda{stroke:var(--azul);stroke-width:10;stroke-linecap:round;}
  .punto{fill:var(--azul);}

  .leyenda{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--suave);}
  .leyenda li{display:flex;align-items:center;gap:6px;}
  .sw{width:16px;height:16px;border-radius:4px;display:inline-block;flex:none;}
  .sw.ok{background:var(--azul);} .sw.so{background:var(--sobra);} .sw.fa{border:2px dashed var(--suave);}

  .ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .ctrl label{font-weight:600;}
  .paso{display:flex;align-items:center;gap:6px;}
  .paso button,.paso input{font:inherit;font-size:1.2rem;height:48px;border:2px solid var(--borde);border-radius:12px;background:var(--tarjeta);color:var(--texto);}
  .paso button{width:48px;cursor:pointer;font-weight:700;}
  .paso button:hover{border-color:var(--azul);}
  .paso input{width:84px;text-align:center;font-weight:700;}
  input[type=range]{width:100%;accent-color:var(--azul);height:32px;margin:8px 0 4px;}
  .mini{margin:10px 0 6px !important;font-size:.95rem;color:var(--suave);font-weight:600;}
  .cuadrados{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;}
  .cuadrados button{font:inherit;cursor:pointer;color:var(--texto);background:transparent;border:2px solid var(--borde);border-radius:10px;padding:4px 2px;line-height:1.2;min-height:48px;}
  .cuadrados button b{display:block;font-size:1.05rem;}
  .cuadrados button small{display:block;font-size:.75rem;color:var(--suave);}
  .cuadrados button:hover{border-color:var(--azul);}
  .cuadrados button.cerca{border-color:var(--azul);background:var(--azul-claro);}

  .raiz{font-size:clamp(2.6rem,6vw,3.6rem);font-weight:700;line-height:1.1;color:var(--azul);}
  .resp{font-size:1.35rem;font-weight:600;margin-top:2px !important;}
  .eq{font-size:1.2rem;font-weight:600;margin-top:10px !important;}
  .eq span{display:block;}
  .hint{font-size:.92rem;color:var(--suave);}

  .barra{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .barra select{font:inherit;border:2px solid var(--borde);border-radius:10px;background:var(--tarjeta);color:var(--texto);padding:6px 8px;}
  .pregunta{font-size:1.35rem;font-weight:600;line-height:1.3;}
  .entradas{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 !important;font-size:1.3rem;font-weight:600;}
  .entradas input{font:inherit;font-size:1.4rem;font-weight:700;width:84px;height:54px;text-align:center;border:2px solid var(--borde);border-radius:12px;background:var(--tarjeta);color:var(--texto);}
  .acciones{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{font:inherit;font-weight:600;cursor:pointer;color:var(--texto);background:transparent;border:2px solid var(--borde);border-radius:999px;padding:10px 18px;min-height:46px;}
  .btn:hover{border-color:var(--azul);}
  .btn.primario{background:var(--azul);border-color:var(--azul);color:#fff;}
  @media (prefers-color-scheme: dark){ .btn.primario{color:#0b1420;} }
  .btn:disabled{opacity:.5;cursor:default;}
  .fb{margin-top:14px !important;padding:10px 14px;border-radius:12px;border:2px solid transparent;}
  .fb.ok{background:var(--ok);border-color:var(--ok-borde);}
  .fb.mal{background:var(--mal);border-color:var(--mal-borde);}
  .fb:empty{display:none;}
  .pista{margin-top:12px !important;padding:10px 14px;border-radius:12px;background:var(--azul-claro);}

  footer{margin-top:36px;padding:18px 0 8px;border-top:1px solid var(--borde);color:var(--suave);font-size:.9rem;}
  footer a{color:inherit;}
</style>
</head>
<body>
<div class="contenedor">

  <header>
    <h1>Raíces cuadradas: ¿entre qué números está?</h1>
    <p>La raíz cuadrada de un número es la medida del lado de un cuadrado que tiene ese número de cuadraditos.</p>
  </header>

  <div class="pestanas" role="tablist" aria-label="Partes del recurso">
    <button type="button" role="tab" id="tab-explorar" aria-controls="explorar" aria-selected="true">Explorar</button>
    <button type="button" role="tab" id="tab-practicar" aria-controls="practicar" aria-selected="false" tabindex="-1">Practicar</button>
  </div>

  <main>
    <!-- EXPLORAR -->
    <section id="explorar" role="tabpanel" aria-labelledby="tab-explorar">
      <div class="rejilla">
        <div class="tarjeta">
          <svg id="cuad" viewBox="0 0 480 520" role="img" aria-label=""></svg>
          <ul class="leyenda" id="leyenda"></ul>
        </div>

        <div class="panel">
          <div class="tarjeta">
            <div class="ctrl">
              <label for="num">Número de cuadraditos</label>
              <div class="paso">
                <button type="button" id="menos" aria-label="Un cuadradito menos">−</button>
                <input id="num" type="number" min="1" max="144" inputmode="numeric" value="15">
                <button type="button" id="mas" aria-label="Un cuadradito más">+</button>
              </div>
            </div>
            <input type="range" id="rango" min="1" max="144" value="15" aria-label="Número de cuadraditos">
            <p class="mini">Cuadrados perfectos (pulsa uno para verlo):</p>
            <div class="cuadrados" id="chips"></div>
          </div>

          <div class="tarjeta">
            <div class="raiz" id="raiz"></div>
            <p class="resp" id="resp"></p>
            <p class="eq" id="eq"></p>
            <p id="l1"></p>
            <p id="l2"></p>
            <p id="l3"></p>
          </div>

          <div class="tarjeta">
            <svg id="recta" viewBox="0 0 600 100" role="img" aria-label=""></svg>
            <p class="hint" id="notarecta"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- PRACTICAR -->
    <section id="practicar" role="tabpanel" aria-labelledby="tab-practicar" hidden>
      <div class="rejilla una" id="rejilla2">
        <div class="tarjeta">
          <div class="barra">
            <strong id="acertadas">Acertadas: 0</strong>
            <label>Números hasta
              <select id="maxn"><option value="100">100</option><option value="144">144</option></select>
            </label>
          </div>
          <p class="pregunta" id="pregunta"></p>
          <p class="entradas" id="entradas"></p>
          <div class="acciones">
            <button type="button" class="btn primario" id="comprobar">Comprobar</button>
            <button type="button" class="btn" id="pista">Pista</button>
            <button type="button" class="btn" id="ver">Ver con cuadraditos</button>
            <button type="button" class="btn" id="sig">Otra pregunta</button>
          </div>
          <p class="fb" id="fb" role="status" aria-live="polite"></p>
          <p class="pista" id="pistatxt" hidden></p>
        </div>
        <div class="tarjeta" id="visual" hidden>
          <svg id="cuad2" viewBox="0 0 480 520" role="img" aria-label=""></svg>
          <ul class="leyenda" id="leyenda2"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer>
    Recurso creado por Clara González Fernández ·
    <a href="https://creativecommons.org/licenses/by/4.0/deed.es" target="_blank" rel="noopener">Licencia CC BY 4.0</a>
  </footer>
</div>

<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function isqrt(n){ var k=0; while((k+1)*(k+1)<=n) k++; return k; }
  function pl(c,u,m){ return c===1?u:m; }
  var MAX=144;

  /* ---------- Cuadraditos ---------- */
  function dibujo(n){
    var k=isqrt(n), perfecto=(k*k===n), K=perfecto?k:k+1, r=n-k*k;
    var cell=Math.min(Math.floor(430/K),64), W=K*cell;
    var gx=(480-W)/2, gy=80+(420-W)/2;
    var o='', i, j;
    function rect(c,f,cls){
      return '<rect class="'+cls+'" x="'+(gx+c*cell+1.5)+'" y="'+(gy+f*cell+1.5)+'" width="'+(cell-3)+'" height="'+(cell-3)+'" rx="'+Math.min(4,cell/8)+'"/>';
    }
    for(i=0;i<k;i++) for(j=0;j<k;j++) o+=rect(j,i,'c-ok');
    if(!perfecto){
      var anillo=[];
      for(i=0;i<k;i++) anillo.push([k,i]);
      for(j=0;j<k;j++) anillo.push([j,k]);
      anillo.push([k,k]);
      for(i=0;i<anillo.length;i++) o+=rect(anillo[i][0],anillo[i][1],i<r?'c-so':'c-fa');
      o+='<rect class="marco" x="'+gx+'" y="'+gy+'" width="'+W+'" height="'+W+'"/>';
    }
    // llave del lado k
    var y1=gy-14, x1=gx, x2=gx+k*cell;
    o+='<path class="llave" d="M'+x1+','+(y1+7)+' V'+y1+' H'+x2+' V'+(y1+7)+'"/>';
    o+='<text class="tx" x="'+((x1+x2)/2)+'" y="'+(y1-8)+'">'+k+'</text>';
    if(!perfecto){
      var y2=gy-46, x3=gx+W;
      o+='<path class="llaveK" d="M'+x1+','+(y2+7)+' V'+y2+' H'+x3+' V'+(y2+7)+'"/>';
      o+='<text class="txK" x="'+((x1+x3)/2)+'" y="'+(y2-8)+'">'+(k+1)+'</text>';
    }
    var etiqueta=perfecto
      ? 'Cuadrado perfecto de '+k+' por '+k+', con '+n+' cuadraditos.'
      : 'Cuadrado completo de '+k+' por '+k+' y '+r+' '+pl(r,'cuadradito','cuadraditos')+' más. Faltan '+(K*K-n)+' para llenar el cuadrado de '+K+' por '+K+'.';
    var ley='<li><span class="sw ok"></span>Cuadrado completo de '+k+' × '+k+' = '+(k*k)+'</li>';
    if(!perfecto){
      ley+='<li><span class="sw so"></span>'+r+' '+pl(r,'cuadradito que sobra','cuadraditos que sobran')+'</li>';
      ley+='<li><span class="sw fa"></span>'+(K*K-n)+' '+pl(K*K-n,'cuadradito que falta','cuadraditos que faltan')+' para el cuadrado de '+K+' × '+K+'</li>';
    }
    return {svg:o,label:etiqueta,leyenda:ley};
  }

  /* ---------- Recta numérica ---------- */
  function recta(n){
    var k=isqrt(n), perfecto=(k*k===n), o='', v;
    function X(a){ return 30+a*45; }
    o+='<line class="eje" x1="'+X(0)+'" y1="58" x2="'+X(12)+'" y2="58"/>';
    for(v=0;v<=12;v++){
      var fuerte=(v===k||(!perfecto&&v===k+1));
      o+='<line class="marca" x1="'+X(v)+'" y1="50" x2="'+X(v)+'" y2="66"/>';
      o+='<text class="num'+(fuerte?' fuerte':'')+'" x="'+X(v)+'" y="88">'+v+'</text>';
    }
    if(perfecto){
      o+='<circle class="punto" cx="'+X(k)+'" cy="58" r="9"/>';
      o+='<text class="tx" x="'+X(k)+'" y="30">√'+n+' = '+k+'</text>';
    } else {
      o+='<line class="banda" x1="'+X(k)+'" y1="58" x2="'+X(k+1)+'" y2="58"/>';
      o+='<text class="tx" x="'+((X(k)+X(k+1))/2)+'" y="30">√'+n+'</text>';
    }
    return o;
  }

  /* ---------- Explorar ---------- */
  var n=15;
  function chips(){
    var k=isqrt(n), perfecto=(k*k===n), html='', j;
    for(j=1;j<=12;j++){
      var cerca=(j===k)||(!perfecto&&j===k+1);
      html+='<button type="button" data-j="'+j+'" class="'+(cerca?'cerca':'')+'" aria-label="Cuadrado perfecto '+(j*j)+', '+j+' al cuadrado"><b>'+(j*j)+'</b><small>'+j+'²</small></button>';
    }
    $('chips').innerHTML=html;
  }
  function lectura(){
    var k=isqrt(n), perfecto=(k*k===n), r=n-k*k, K=k+1, falta=K*K-n;
    $('raiz').textContent='√'+n;
    if(perfecto){
      $('resp').textContent='Es exacta: vale '+k;
      $('eq').innerHTML='<span>'+k+' × '+k+' = '+n+'</span><span>√'+n+' = '+k+'</span>';
      $('l1').textContent='Con '+n+' cuadraditos formo un cuadrado perfecto de '+k+' × '+k+'.';
      $('l2').textContent='El lado mide '+k+', así que la raíz cuadrada de '+n+' es '+k+'.';
      $('l3').textContent='';
      $('notarecta').textContent='Cuando el número es un cuadrado perfecto, la raíz cae justo en un número entero.';
      $('recta').setAttribute('aria-label','Recta numérica: √'+n+' es igual a '+k);
    } else {
      $('resp').textContent='Está entre '+k+' y '+K;
      $('eq').innerHTML='<span>'+k+'² = '+(k*k)+'  <  '+n+'  <  '+(K*K)+' = '+K+'²</span><span>'+k+' < √'+n+' < '+K+'</span>';
      $('l1').textContent='Con '+n+' cuadraditos formo un cuadrado completo de '+k+' × '+k+' = '+(k*k)+', y me '+pl(r,'sobra','sobran')+' '+r+'.';
      $('l2').textContent='Para llenar el siguiente cuadrado, de '+K+' × '+K+' = '+(K*K)+', '+pl(falta,'me falta','me faltan')+' '+falta+'.';
      $('l3').textContent='Como '+n+' no llena ningún cuadrado completo, su raíz cuadrada no es un número entero: está entre '+k+' y '+K+'.';
      $('notarecta').textContent='La raíz cuadrada no cae en un número entero: queda en el tramo entre '+k+' y '+K+'.';
      $('recta').setAttribute('aria-label','Recta numérica: √'+n+' está entre '+k+' y '+K);
    }
  }
  function pintar(){
    var d=dibujo(n);
    $('cuad').innerHTML=d.svg;
    $('cuad').setAttribute('aria-label',d.label);
    $('leyenda').innerHTML=d.leyenda;
    $('recta').innerHTML=recta(n);
    lectura();
    chips();
  }
  function poner(v,reescribirCampo){
    v=Math.round(v);
    if(isNaN(v)) return;
    n=Math.max(1,Math.min(MAX,v));
    $('rango').value=n;
    if(reescribirCampo) $('num').value=n;
    pintar();
  }
  $('rango').addEventListener('input',function(){ poner(+this.value,true); });
  $('num').addEventListener('input',function(){
    var v=parseInt(this.value,10);
    if(!isNaN(v)&&v>=1&&v<=MAX) poner(v,false);
  });
  $('num').addEventListener('change',function(){ poner(parseInt(this.value,10)||n,true); });
  $('num').addEventListener('focus',function(){ this.select(); });
  $('menos').addEventListener('click',function(){ poner(n-1,true); });
  $('mas').addEventListener('click',function(){ poner(n+1,true); });
  $('chips').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    var j=+b.getAttribute('data-j'); poner(j*j,true);
  });

  /* ---------- Practicar ---------- */
  var pr={n:0,k:0,perfecto:false,hecho:false,pista:0,acertadas:0};
  function nueva(){
    var max=+$('maxn').value, kmax=isqrt(max);
    pr.perfecto=Math.random()<0.25;
    if(pr.perfecto){
      pr.k=2+Math.floor(Math.random()*(kmax-1));
      pr.n=pr.k*pr.k;
    } else {
      do { pr.n=2+Math.floor(Math.random()*(max-1)); } while(isqrt(pr.n)*isqrt(pr.n)===pr.n);
      pr.k=isqrt(pr.n);
    }
    pr.hecho=false; pr.pista=0;
    $('pregunta').textContent=pr.perfecto
      ? '¿Cuánto vale √'+pr.n+'?'
      : '¿Entre qué dos números enteros seguidos está √'+pr.n+'?';
    $('entradas').innerHTML=pr.perfecto
      ? '<span>√'+pr.n+' =</span><input id="in1" type="number" inputmode="numeric" min="0" max="13" aria-label="Valor de la raíz">'
      : '<span>Está entre</span><input id="in1" type="number" inputmode="numeric" min="0" max="13" aria-label="Número menor"><span>y</span><input id="in2" type="number" inputmode="numeric" min="0" max="13" aria-label="Número mayor">';
    $('fb').textContent=''; $('fb').className='fb';
    $('pistatxt').hidden=true; $('pistatxt').textContent='';
    $('visual').hidden=true; $('rejilla2').classList.add('una');
    $('comprobar').disabled=false;
    var ins=$('entradas').querySelectorAll('input');
    for(var i=0;i<ins.length;i++){
      ins[i].addEventListener('keydown',function(e){ if(e.key==='Enter') comprobar(); });
      ins[i].addEventListener('focus',function(){ this.select(); });
    }
    $('in1').focus();
  }
  function mensaje(txt,tipo){ var f=$('fb'); f.textContent=txt; f.className='fb'+(tipo?' '+tipo:''); }
  function verCuadraditos(){
    var d=dibujo(pr.n);
    $('cuad2').innerHTML=d.svg;
    $('cuad2').setAttribute('aria-label',d.label);
    $('leyenda2').innerHTML=d.leyenda;
    $('visual').hidden=false; $('rejilla2').classList.remove('una');
  }
  function comprobar(){
    if(pr.hecho) return;
    var a=parseInt($('in1').value,10), b, txt;
    if(pr.perfecto){
      if(isNaN(a)){ mensaje('Escribe un número.','mal'); return; }
      if(a===pr.k){ acierto('¡Correcto! '+pr.k+' × '+pr.k+' = '+pr.n+', así que √'+pr.n+' = '+pr.k+'.'); return; }
      txt=a+' × '+a+' = '+(a*a)+', y no es '+pr.n+'. ';
      txt+=(a*a<pr.n)?'Te has quedado corto: prueba con un número mayor.':'Te has pasado: prueba con un número menor.';
      mensaje(txt,'mal');
    } else {
      b=parseInt($('in2').value,10);
      if(isNaN(a)||isNaN(b)){ mensaje('Escribe los dos números.','mal'); return; }
      if(b!==a+1){ mensaje('Tienen que ser dos números seguidos, como 7 y 8.','mal'); return; }
      if(a===pr.k){
        acierto('¡Muy bien! '+a+'² = '+(a*a)+' y '+b+'² = '+(b*b)+', y '+pr.n+' está entre los dos. Por eso '+a+' < √'+pr.n+' < '+b+'.');
        return;
      }
      txt=a+'² = '+(a*a)+' y '+b+'² = '+(b*b)+', pero '+pr.n+' no está entre '+(a*a)+' y '+(b*b)+'. ';
      txt+=(b*b<pr.n)?'Te has quedado corto: prueba con números mayores.':'Te has pasado: prueba con números menores.';
      mensaje(txt,'mal');
    }
  }
  function acierto(txt){
    pr.hecho=true; pr.acertadas++;
    $('acertadas').textContent='Acertadas: '+pr.acertadas;
    mensaje(txt,'ok');
    $('comprobar').disabled=true;
    verCuadraditos();
    $('sig').focus();
  }
  $('comprobar').addEventListener('click',comprobar);
  $('sig').addEventListener('click',nueva);
  $('ver').addEventListener('click',verCuadraditos);
  $('maxn').addEventListener('change',nueva);
  $('pista').addEventListener('click',function(){
    var cuadrados=[], j, max=+$('maxn').value, p=$('pistatxt');
    for(j=1;j*j<=max;j++) cuadrados.push(j*j);
    pr.pista=Math.min(2,pr.pista+1);
    if(pr.pista===1){
      p.textContent='Los cuadrados perfectos son: '+cuadrados.join(', ')+'.';
    } else if(pr.perfecto){
      p.textContent='Busca '+pr.n+' en la lista: ¿de qué número es el cuadrado?';
    } else {
      p.textContent=pr.n+' queda entre '+(pr.k*pr.k)+' y '+((pr.k+1)*(pr.k+1))+'. ¿De qué números son cuadrados?';
    }
    p.hidden=false;
  });

  /* ---------- Pestañas ---------- */
  var tabs=Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  var paneles=tabs.map(function(t){ return $(t.getAttribute('aria-controls')); });
  function mostrar(i,enfocar,guardar){
    tabs.forEach(function(t,j){
      t.setAttribute('aria-selected',j===i?'true':'false');
      t.tabIndex=(j===i)?0:-1;
      paneles[j].hidden=(j!==i);
    });
    if(enfocar) tabs[i].focus();
    if(guardar&&window.history&&history.replaceState) history.replaceState(null,'','#'+paneles[i].id);
  }
  tabs.forEach(function(t,i){
    t.addEventListener('click',function(){ mostrar(i,false,true); });
    t.addEventListener('keydown',function(e){
      var c=tabs.length, nuevo=null;
      if(e.key==='ArrowRight') nuevo=(i+1)%c;
      else if(e.key==='ArrowLeft') nuevo=(i-1+c)%c;
      else if(e.key==='Home') nuevo=0;
      else if(e.key==='End') nuevo=c-1;
      if(nuevo!==null){ e.preventDefault(); mostrar(nuevo,true,true); }
    });
  });

  pintar();
  nueva();
  $('in1').blur();
  var inicio=0, hash=location.hash.slice(1);
  paneles.forEach(function(p,i){ if(p.id===hash) inicio=i; });
  mostrar(inicio,false,false);
})();
</script>
</body>
</html>
